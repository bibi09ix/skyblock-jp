plugins { id 'net.fabricmc.fabric-loom' version '1.16.1' }
version = '0.6.4'
group = 'local.skyblockjp'
repositories { mavenCentral() }
dependencies {
    minecraft 'com.mojang:minecraft:26.2'
    implementation 'net.fabricmc:fabric-loader:0.19.5'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.161.0+26.2'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
java { sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25; withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 25 }
test { useJUnitPlatform() }

processResources {
    def updateRepo = providers.gradleProperty('updateRepository').getOrElse('')
    inputs.property 'updateRepository', updateRepo
    filesMatching('skyblock-jp-update.properties') { expand(updateRepository: updateRepo) }
}

