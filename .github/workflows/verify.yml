name: Verify source and dictionary
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Verify source and report tooling
        run: python3 -m unittest discover -s scripts/tests
      - name: Reproduce dictionary from public editorial source
        run: python3 scripts/verify_dictionary_reproduction.py
      - name: Audit English preservation decisions
        run: python3 scripts/dictionary_audit.py src/main/resources/assets/skyblock_jp/dictionary/candidate.json --output build/reports/dictionary-audit.json --check
      - name: Check formatting, code, rendering coverage and build
        run: bash gradlew spotlessCheck offlineTest dictionaryCoverage build -x test --console=plain
      - name: Check rendering baseline
        run: python3 scripts/coverage_report.py build/reports/dictionary-coverage/current.json --baseline src/test/resources/dictionary-coverage-baseline.json
