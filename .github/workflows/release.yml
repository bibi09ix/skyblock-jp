name: Publish SkyBlock JP
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: skyblock-jp-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Build and test
        run: bash gradlew build --console=plain "-PupdateRepository=$GITHUB_REPOSITORY"
      - name: Prepare verified release assets
        id: release
        shell: bash
        run: |
          VERSION=$(python3 scripts/prepare_release.py --repository "$GITHUB_REPOSITORY")
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo 'Tag must match build.gradle version'; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          gh release create "v$VERSION" release-assets/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "SkyBlock JP $VERSION (Minecraft 26.2)" --generate-notes
